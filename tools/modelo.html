<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pix para Rafael Costa</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --fundo: #f5f3ee;
    --papel: #ffffff;
    --texto: #1c1b1a;
    --suave: #6b6760;
    --linha: #e2ded5;
    --destaque: #4b2470;
    --destaque-escuro: #3a1a58;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 400px; margin: 0 auto; padding: 32px 20px 40px; }
  .para { margin: 0; font-size: 15px; color: var(--suave); }
  h1 { margin: 2px 0 22px; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em; }
  .qr {
    background: var(--papel);
    border: 1px solid var(--linha);
    border-radius: 16px;
    overflow: hidden;
  }
  .qr svg { display: block; width: 100%; height: auto; }
  .chave {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 20px 0;
    padding: 14px 2px;
    border-top: 1px solid var(--linha);
    border-bottom: 1px solid var(--linha);
  }
  .chave span { font-size: 15px; color: var(--suave); }
  .chave strong { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  button {
    display: block;
    width: 100%;
    min-height: 60px;
    border: 2px solid var(--destaque);
    border-radius: 12px;
    background: var(--destaque);
    color: #fff;
    font: inherit;
    font-size: 18px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { background: var(--destaque-escuro); border-color: var(--destaque-escuro); }
  button.ok { background: var(--papel); color: var(--destaque); }
  button:focus-visible { outline: 3px solid var(--texto); outline-offset: 3px; }
  .dica { margin: 14px 4px 0; font-size: 15px; color: var(--suave); text-align: center; text-wrap: balance; }
</style>
</head>
<body>
<main>
  <p class="para">Pix para</p>
  <h1>Rafael Costa</h1>
  <div class="qr">{{QR}}</div>
  <div class="chave"><span>Chave (celular)</span><strong>{{CHAVE}}</strong></div>
  <button type="button" id="copiar" data-pix="{{PAYLOAD}}">Copiar código Pix</button>
  <p class="dica">No app do banco, escolha Pix Copia e Cola e cole o código.</p>
</main>
<script>
  var botao = document.getElementById('copiar');
  var timer;
  function copiado() {
    botao.textContent = 'Copiado';
    botao.classList.add('ok');
    clearTimeout(timer);
    timer = setTimeout(function () {
      botao.textContent = 'Copiar código Pix';
      botao.classList.remove('ok');
    }, 2000);
  }
  function copiarAntigo(texto) {
    var campo = document.createElement('textarea');
    campo.value = texto;
    campo.setAttribute('readonly', '');
    campo.style.position = 'fixed';
    campo.style.opacity = '0';
    document.body.appendChild(campo);
    campo.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(campo);
    return ok;
  }
  botao.addEventListener('click', function () {
    var texto = botao.dataset.pix;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(copiado, function () { if (copiarAntigo(texto)) copiado(); });
    } else if (copiarAntigo(texto)) {
      copiado();
    }
  });
</script>
</body>
</html>
